apiVersion: apps/v1
kind: Deployment
metadata:
  name: velos-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: velos-api
  template:
    metadata:
      labels:
        app: velos-api
    spec:
      containers:
        - name: api
          image: madiouma/velos-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: velos-secret
                  key: database_url
          readinessProbe:
            httpGet:
              path: /sante
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /sante
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: velos-api
spec:
  type: NodePort
  selector:
    app: velos-api
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30081
